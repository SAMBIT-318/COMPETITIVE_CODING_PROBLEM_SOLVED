name: Auto-Delete README files

on:
  push:
    branches:
      - main # Change to 'master' if that is your default branch

jobs:
  remove-readmes:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Find and Delete README.md files
        run: |
          # This deletes all README.md files in the repository and its subfolders
          find . -name "README.md" -type f -delete
          
      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -u
          # Only commit and push if a file was actually deleted
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-removed README.md" && git push)
